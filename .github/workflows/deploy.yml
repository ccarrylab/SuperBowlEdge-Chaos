name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: us-east-1
      
      - name: Create deployment content
        run: |
          mkdir -p app/dist
          cat > app/dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SuperBowlEdge-Chaos - DevOps Portfolio</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #0a0e27; color: #fff; }
              h1 { color: #00d4ff; }
              .badge { display: inline-block; margin: 5px; padding: 8px 12px; background: #1a1f3a; border-radius: 4px; }
              .success { color: #00ff88; }
            </style>
          </head>
          <body>
            <h1>🚀 SuperBowlEdge-Chaos</h1>
            <p class="success">✅ Deployment Successful - ${{ inputs.environment }} environment</p>
            <p>AWS Edge Infrastructure + Chaos Engineering Platform</p>
            <div>
              <span class="badge">AWS S3</span>
              <span class="badge">CloudFront CDN</span>
              <span class="badge">Terraform IaC</span>
              <span class="badge">GitHub Actions CI/CD</span>
              <span class="badge">OIDC Security</span>
            </div>
            <p><small>Deployed: $(date -u +"%Y-%m-%d %H:%M:%S UTC") | Run: ${{ github.run_id }}</small></p>
            <p><a href="https://github.com/ccarrylab/superbowl-edge-chaos" style="color: #00d4ff;">View GitHub Repository</a></p>
          </body>
          </html>
          EOF
      
      - name: Deploy to S3
        run: |
          BUCKET="superbowl-edge-${{ inputs.environment }}-content-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "📦 Deploying to S3 (bucket hidden for security)"
          aws s3 sync app/dist/ s3://$BUCKET/ --delete --cache-control "max-age=300"
          echo "✅ Deployment complete"
      
      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront distribution"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ Invalidation created: $INVALIDATION_ID"
      
      - name: Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${{ inputs.environment }}"
          echo "🌐 URL: https://chaos.ccarrylab.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
