name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  infrastructure-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          soft_fail: true
          config_file: infrastructure/.checkov.yaml
      
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/
          soft_fail: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install deps
        working-directory: app
        run: npm ci
      
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=critical || true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [infrastructure-security, secret-scan, dependency-scan]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "✅ Security scans completed"
          echo "- Infrastructure: ${{ needs.infrastructure-security.result }}"
          echo "- Secrets: ${{ needs.secret-scan.result }}"
          echo "- Dependencies: ${{ needs.dependency-scan.result }}"
