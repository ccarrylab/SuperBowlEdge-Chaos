name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  infrastructure-security:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          config_file: infrastructure/.checkov.yaml
          quiet: true
          compact: true
          soft_fail: false
      
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/
          soft_fail: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: app
        run: npm ci
      
      - name: npm audit (critical only)
        working-directory: app
        run: npm audit --audit-level=critical || true

  security-summary:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [infrastructure-security, secret-scan, dependency-scan]
    if: always()
    
    steps:
      - name: Check Results
        run: |
          echo "## 🔒 Security Scan Results"
          echo ""
          echo "✅ Infrastructure Security: ${{ needs.infrastructure-security.result }}"
          echo "✅ Secret Scanning: ${{ needs.secret-scan.result }}"
          echo "✅ Dependency Scanning: ${{ needs.dependency-scan.result }}"
          echo ""
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ CRITICAL: Secrets detected!"
            exit 1
          fi
          echo "✅ All security checks passed!"
