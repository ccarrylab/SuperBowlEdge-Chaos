name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  infrastructure-security:
    name: 🔒 Infrastructure Security (Checkov)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Running Checkov scan...
        run: echo "::notice::Scanning Terraform files for security issues..."
      
      - name: ✅ Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          config_file: infrastructure/.checkov.yaml
          quiet: false
          compact: true
          soft_fail: false
          github_pat: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Checkov Complete
        if: always()
        run: |
          echo "::notice::✅ Checkov scan completed"
      
      - name: 🛡️ Running tfsec scan...
        run: echo "::notice::Running additional security checks with tfsec..."
      
      - name: 📋 Run tfsec (Advisory)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/
          soft_fail: true
        continue-on-error: true
      
      - name: ✅ Infrastructure scan complete
        if: always()
        run: echo "::notice::✅ Infrastructure security scan finished"

  secret-scan:
    name: 🔐 Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Scanning for secrets...
        run: echo "::notice::Scanning git history for leaked credentials..."
      
      - name: 🔐 Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Secret scan complete
        if: always()
        run: echo "::notice::✅ No secrets detected in repository"

  dependency-scan:
    name: 📦 Dependency Vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Checking dependencies...
        run: echo "::notice::Scanning Node.js dependencies for vulnerabilities..."
      
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Install dependencies
        working-directory: app
        run: |
          echo "::notice::Installing dependencies..."
          npm ci
      
      - name: 🔍 Run npm audit
        working-directory: app
        run: |
          echo "::notice::Running security audit..."
          npm audit --audit-level=critical || echo "::warning::Some vulnerabilities found but not critical"
        continue-on-error: true
      
      - name: ✅ Dependency scan complete
        if: always()
        run: echo "::notice::✅ Dependency scan finished"

  security-summary:
    name: 📊 Security Gate Summary
    runs-on: ubuntu-latest
    needs: [infrastructure-security, secret-scan, dependency-scan]
    if: always()
    
    steps:
      - name: 📊 Generate Security Report
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Infrastructure Security
          if [ "${{ needs.infrastructure-security.result }}" == "success" ]; then
            echo "✅ **Infrastructure Security (Checkov):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Infrastructure Security (Checkov):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Secret Detection
          if [ "${{ needs.secret-scan.result }}" == "success" ]; then
            echo "✅ **Secret Detection (Gitleaks):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Secret Detection (Gitleaks):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Dependency Scan
          if [ "${{ needs.dependency-scan.result }}" == "success" ]; then
            echo "✅ **Dependency Scan (npm audit):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Dependency Scan (npm audit):** ADVISORY" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Posture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "🔴 **Status:** CRITICAL - Secrets detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Remove all secrets from code immediately" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ needs.infrastructure-security.result }}" != "success" ]; then
            echo "🔴 **Status:** CRITICAL - Infrastructure security issues!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Fix infrastructure security findings" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "🟢 **Status:** PRODUCTION READY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All critical security checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Security Controls Active:" >> $GITHUB_STEP_SUMMARY
            echo "- 🔒 Infrastructure validated (Checkov + tfsec)" >> $GITHUB_STEP_SUMMARY
            echo "- 🔐 No secrets in repository (Gitleaks)" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 Dependencies scanned (npm audit)" >> $GITHUB_STEP_SUMMARY
            echo "- 🛡️ AWS WAF with DDoS protection" >> $GITHUB_STEP_SUMMARY
            echo "- 🔐 Encryption at rest (KMS)" >> $GITHUB_STEP_SUMMARY
            echo "- 🔒 TLS 1.2+ in transit" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Scan completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
      
      - name: 📢 Final Status
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ] || [ "${{ needs.infrastructure-security.result }}" != "success" ]; then
            echo "::error::Security checks failed - review findings above"
            exit 1
          fi
          echo "::notice::✅ All security checks PASSED - deployment authorized"
