<!DOCTYPE html><html><body style="font-family:Arial">
<h1>🧨 Chaos Control Panel</h1>
<div>ALB: <span id="alb">100%</span>% | CPU: <span id="cpu">0</span>%</div>
<button onclick="runChaos('cpu',4,300)">💻 CPU 100% (5min)</button>
<button onclick="runChaos('net',16,300)">🌐 Network Flood (5min)</button>
<button onclick="runChaos('mem',2,600)">🧠 Memory 4GB (10min)</button>
<div id="experiments"></div>
<script>
async function runChaos(type,workers,seconds){
  document.getElementById('experiments').innerHTML+='<li>'+type.toUpperCase()+' '+workers+'w '+seconds+'s - <span id="s'+Date.now()+'">RUNNING</span></li>';
  const r=await fetch('/chaos/start',{method:'POST',body:JSON.stringify({type,workers,seconds})});
  const id=await r.text();
  setTimeout(()=>document.getElementById('s'+Date.now()).innerText='ID: '+id,5000);
}
setInterval(async()=>{
  const d=await (await fetch('/metrics/alb')).json(); document.getElementById('alb').innerText=d.healthPercentage;
  const c=await (await fetch('/metrics/cpu')).json(); document.getElementById('cpu').innerText=c.utilization;
},5000);
</script></body></html>
