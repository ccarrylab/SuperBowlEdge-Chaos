<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperBowlEdge Chaos Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,:before,:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,"Inter",sans-serif}
body{margin:0;background-color:#0a0a0f;color:#f8fafc;font-feature-settings:normal;font-variation-settings:normal}
.container{max-width:80rem;margin:0 auto;padding:2rem}
h1{font-size:3rem;font-weight:800;color:#00ff88;text-align:center;margin-bottom:2rem}
.status{position:fixed;top:2rem;right:2rem;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:0.625rem;padding:1.5rem;min-width:300px;box-shadow:0 25px 50px -12px rgb(0 0 0 / 0.25)}
.status h3{font-size:1.125rem;color:#3b82f6;margin-bottom:1rem;font-weight:600}
.status-value{font-size:1.875rem;font-weight:800}
.status-running{color:#ef4444}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem;margin:3rem 0}
.btn{padding:1.5rem 2rem;font-size:1.125rem;font-weight:600;border:none;border-radius:calc(0.625rem - 2px);cursor:pointer;transition:all 0.3s;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1)}
.btn-cpu{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.btn-net{background:linear-gradient(135deg,#3b82f6,#2563eb);color:white}
.btn-mem{background:linear-gradient(135deg,#f59e0b,#d97706);color:white}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem;margin:4rem 0}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:0.625rem;padding:2rem;text-align:center;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);transition:all 0.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1)}
.card h3{font-size:1rem;color:#94a3b8;margin-bottom:1rem}
.card-value{font-size:1.875rem;font-weight:700;color:#3b82f6}
.stack{font-family:ui-monospace,SFMono-Regular,Menlo;font-size:0.875rem;color:#10b981;line-height:1.75}
</style>
</head>
<body>
<div class="container">
<h1>SuperBowlEdge Chaos Dashboard</h1>

<div class="status">
<h3>Live Chaos Status</h3>
<div id="status" class="status-value">IDLE</div>
<div id="details" style="font-size:0.875rem;color:#94a3b8;margin-top:0.75rem"></div>
</div>

<div style="text-align:center;margin:3rem 0">
<h2 style="font-size:1.875rem;color:#3b82f6;margin-bottom:2rem">Production Chaos Controls</h2>
<div class="buttons">
<button class="btn btn-cpu" onclick="chaosTest('cpu')">CPU Storm (4w 60s)</button>
<button class="btn btn-net" onclick="chaosTest('network')">Network Jam (2w 120s)</button>
<button class="btn btn-mem" onclick="chaosTest('memory')">Memory Leak (1w 300s)</button>
</div>
</div>

<div class="metrics">
<div class="card">
<h3>Target Instance</h3>
<div class="card-value">i-091798990d74dde24</div>
</div>
<div class="card">
<h3>Lambda Function</h3>
<div class="card-value">sb-edge-chaos-trigger</div>
</div>
<div class="card">
<h3>Architecture Stack</h3>
<div class="stack">CloudFront -> S3 -> Lambda -> SSM<br>-> EC2 -> ALB -> CloudWatch</div>
</div>
</div>
</div>

<script>
async function updateStatus(){
  try{
    const response = await fetch('https://chaos.ccarrylab.com/status.json');
    const status = await response.json();
    document.getElementById('status').textContent = status.status.toUpperCase();
    if(status.status === 'running'){
      document.getElementById('status').classList.add('status-running');
    } else {
      document.getElementById('status').classList.remove('status-running');
    }
    document.getElementById('details').innerHTML = `
      Instance: ${status.instance}<br>
      Last: ${status.lastChaos || 'None'}<br>
      ${new Date(status.timestamp).toLocaleString()}
    `;
  } catch(e) {
    document.getElementById('status').textContent = 'UNAVAILABLE';
  }
}

async function chaosTest(type){
  const payloads = {
    cpu: {type: 'cpu', workers: 4, seconds: 60},
    network: {type: 'network', workers: 2, seconds: 120},
    memory: {type: 'memory', workers: 1, seconds: 300}
  };
  
  try {
    await fetch('https://sb-edge-chaos-trigger.lambda-url.us-east-1.on.aws/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payloads[type])
    });
  } catch(e) {}
  
  updateStatus();
}

// Update every 2.5 seconds
updateStatus();
setInterval(updateStatus, 2500);
</script>
</body>
</html>
