<!DOCTYPE html>
<html>
<head>
<title>SuperBowlEdge Chaos Dashboard</title>
<style>
:root{--bg:#0a0a0f;--fg:#f8fafc;--primary:#3b82f6;--danger:#ef4444;--success:#10b981;--radius:.625rem}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--fg);padding:2rem;min-height:100vh}
.container{max-width:1200px;margin:0 auto}
h1{font-size:3.5rem;font-weight:900;text-align:center;margin:2rem 0;background:linear-gradient(135deg,var(--primary),#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status-bar{position:fixed;top:1rem;right:1rem;background:rgba(18,18,26,.95);backdrop-filter:blur(20px);border:1px solid #2d2d3a;border-radius:var(--radius);padding:1rem;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:1000}
.status-bar h3{font-size:1rem;color:var(--primary);margin-bottom:.5rem}
.status-value{font-size:1.25rem;font-weight:700}
.running{color:var(--danger)!important}
.live{padding:2rem;text-align:center}
.buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:2rem 0}
.btn{padding:1.2rem 2.5rem;font-size:1.1rem;font-weight:700;border:none;border-radius:var(--radius);color:white;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:all .3s;min-width:220px}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.btn-cpu{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn-net{background:linear-gradient(135deg,var(--primary),#2563eb)}
.btn-mem{background:linear-gradient(135deg,#f59e0b,#d97706)}
.metrics{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));display:grid;gap:1.5rem;margin:3rem 0}
.card{background:rgba(18,18,26,.8);backdrop-filter:blur(10px);border:1px solid #2d2d3a;border-radius:var(--radius);padding:2rem}
</style>
</head>
<body>
<div class="container">
  <h1>🧨 SuperBowlEdge Chaos Dashboard</h1>
  
  <div class="status-bar">
    <h3>Live Chaos Status</h3>
    <div id="status" class="status-value">Loading...</div>
    <div id="details" style="font-size:.9rem;color:#94a3b8;margin-top:.5rem"></div>
  </div>

  <div class="live">
    <h2 style="color:var(--primary);margin-bottom:1rem">💥 Production Chaos Control</h2>
    <div class="buttons">
      <button class="btn btn-cpu" onclick="chaosTest('cpu',4,60)">🔥 CPU Storm (4w 60s)</button>
      <button class="btn btn-net" onclick="chaosTest('network',2,120)">🌐 Network Jam (2w 120s)</button>
      <button class="btn btn-mem" onclick="chaosTest('memory',1,300)">🧠 Memory Leak (1w 300s)</button>
    </div>
  </div>

  <div class="metrics">
    <div class="card"><h3>Target Instance</h3><div style="font-size:1.5rem;color:var(--success)">i-091798990d74dde24</div></div>
    <div class="card"><h3>Lambda</h3><div style="font-size:1.5rem;color:var(--primary)">sb-edge-chaos-trigger</div></div>
    <div class="card"><h3>Stack</h3><div>CloudFront→S3→Lambda→SSM→EC2→ALB</div></div>
  </div>
</div>

<script>
let statusInterval;
async function updateStatus(){
  try{
    const r=await fetch('https://superbowl-edge-dev-content-089719647189.s3.us-east-1.amazonaws.com/status.json?'+Date.now());
    const s=await r.json();
    const el=document.getElementById('status');
    const details=document.getElementById('details');
    el.textContent=s.status.toUpperCase();
    el.className=s.status==='running'?'status-value running':''+(s.status==='completed'?' status-value':'');
    details.innerHTML=`Instance: ${s.instance}<br>Last: ${s.lastChaos||'Idle'} @ ${new Date(s.timestamp).toLocaleTimeString()}`;
  }catch(e){
    document.getElementById('status').textContent='Status Unavailable';
  }
}

async function chaosTest(type,workers,seconds){
  const payload={type,workers,seconds};
  // Trigger Lambda
  await fetch('https://sb-edge-chaos-trigger.lambda-url.us-east-1.on.aws/',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
  });
  updateStatus(); // Refresh status
}

updateStatus();
statusInterval=setInterval(updateStatus,2000);
</script>
</body>
</html>
