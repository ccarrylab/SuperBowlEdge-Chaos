<!DOCTYPE html>
<html>
<head><title>🧨 SuperBowlEdge Chaos</title>
<style>body{font-family:monospace;background:#000;color:#0f0;padding:40px}
button{padding:20px 40px;font-size:20px;background:#f44;margin:20px;border-radius:8px;cursor:pointer}
#metrics{font-size:24px;background:#111;padding:20px;border:1px solid #0f0}
</style>
</head>
<body>
<h1>🚀 Chaos Engineering Dashboard</h1>
<div id="metrics">
  ALB: <span id="alb">100</span>% | CPU: <span id="cpu">19</span>% | Instance: i-091798990d74dde24
</div>
<button onclick="stress('cpu')">💥 CPU MELTDOWN</button>
<button onclick="stress('net')">🌊 NETWORK FLOOD</button>
<button onclick="stress('mem')">🧠 MEMORY EXHAUST</button>
<div id="log"></div>

<script>
async function stress(type) {
  const btn=event.target; btn.disabled=true;
  try {
    const r=await fetch('https://3p1k0.execute-api.us-east-1.amazonaws.com/default/sb-edge-chaos-trigger', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,workers:4,seconds:300})
    });
    document.getElementById('log').innerHTML += `<p>${type.toUpperCase()}: ${await r.text()}</p>`;
  } catch(e) { alert('API error - check Lambda URL') }
  btn.disabled=false;
}
</script>
</body>
</html>
