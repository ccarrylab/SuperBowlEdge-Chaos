<!DOCTYPE html>
<html lang="en" class="dark" style="background:#0a0a0f">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperBowlEdge Chaos Dashboard</title>
<link rel="stylesheet" href="https://chaos.ccarrylab.com/assets/index-znNhZBVM.css">
<style>
body{background:#0a0a0f!important;color:#f8fafc;margin:0;padding:0}
.status-card{position:fixed;top:1.5rem;right:1.5rem;background:#12121a;border:1px solid #2d2d3a;border-radius:0.625rem;padding:1.5rem;min-width:300px;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);z-index:50}
.status-card h3{font-size:0.875rem;color:#94a3b8;margin-bottom:0.5rem;font-weight:500}
.status-value{font-size:1.5rem;font-weight:700;color:#f8fafc}
.status-running{color:#ef4444;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.btn-chaos{padding:1.2rem 2rem;font-size:1.125rem;font-weight:600;border-radius:calc(0.625rem - 2px);border:none;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);text-align:left}
.btn-chaos:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1)}
.btn-cpu{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-net{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.btn-mem{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.card-bg{background:#12121a;border:1px solid #2d2d3a;border-radius:0.625rem}
</style>
</head>
<body>
<div class="container mx-auto px-4 py-8 max-w-7xl">

<div class="status-card">
<h3>Live Chaos Status</h3>
<div id="status" class="status-value">IDLE</div>
<div id="details" style="font-size:0.75rem;color:#94a3b8;margin-top:0.5rem"></div>
</div>

<header class="text-center mb-12">
<h1 class="text-5xl md:text-6xl font-black mb-4 bg-gradient-to-r from-blue-500 via-emerald-400 to-amber-500 bg-clip-text text-transparent">SuperBowlEdge Chaos Dashboard</h1>
<p class="text-xl text-muted-foreground" style="color:#94a3b8">Production Infrastructure Chaos Engineering</p>
</header>

<section class="mb-16">
<h2 class="text-2xl font-bold mb-8 text-center" style="color:#3b82f6">Execute Chaos Injection</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
<button onclick="chaos('cpu')" class="btn-chaos btn-cpu">
<div class="text-lg font-semibold">CPU Storm</div>
<div class="text-sm opacity-80 mt-1">4 workers • 60 seconds</div>
</button>
<button onclick="chaos('network')" class="btn-chaos btn-net">
<div class="text-lg font-semibold">Network Jam</div>
<div class="text-sm opacity-80 mt-1">2 workers • 120 seconds</div>
</button>
<button onclick="chaos('memory')" class="btn-chaos btn-mem">
<div class="text-lg font-semibold">Memory Leak</div>
<div class="text-sm opacity-80 mt-1">1 worker • 300 seconds</div>
</button>
</div>
</section>

<section class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="card-bg p-6 text-center hover:scale-105 transition-all">
<h3 class="text-sm mb-2 font-medium" style="color:#94a3b8">Target Instance</h3>
<div class="text-2xl font-bold" style="color:#10b981">i-091798990d74dde24</div>
</div>
<div class="card-bg p-6 text-center hover:scale-105 transition-all">
<h3 class="text-sm mb-2 font-medium" style="color:#94a3b8">Lambda Function</h3>
<div class="text-2xl font-bold" style="color:#3b82f6">sb-edge-chaos-trigger</div>
</div>
<div class="card-bg p-6 text-center hover:scale-105 transition-all">
<h3 class="text-sm mb-2 font-medium" style="color:#94a3b8">Architecture Stack</h3>
<div class="font-mono text-sm leading-relaxed" style="color:#10b981">CloudFront → S3 → Lambda<br>→ SSM → EC2 → ALB</div>
</div>
</section>

</div>

<script>
async function update(){
  try{
    const r=await fetch('https://chaos.ccarrylab.com/status.json');
    const s=await r.json();
    const el=document.getElementById('status');
    el.textContent=s.status.toUpperCase();
    el.className=s.status==='running'?'status-value status-running':'status-value';
    document.getElementById('details').innerHTML=`Instance: ${s.instance}<br>Last: ${s.lastChaos||'None'}<br>${new Date(s.timestamp).toLocaleString()}`;
  }catch(e){
    document.getElementById('status').textContent='UNAVAILABLE';
  }
}
async function chaos(t){
  const p={cpu:{type:'cpu',workers:4,seconds:60},network:{type:'network',workers:2,seconds:120},memory:{type:'memory',workers:1,seconds:300}};
  try{
    await fetch('https://sb-edge-chaos-trigger.lambda-url.us-east-1.on.aws/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p[t])});
  }catch(e){}
  update();
}
update();
setInterval(update,2500);
</script>
</body>
</html>
